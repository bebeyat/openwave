# Release workflow: runs when a tag like v0.1.0 is pushed. It builds Windows (installer + portable zip),
# Linux (tar.gz) and macOS (Apple Silicon .app in a zip), writes SHA256SUMS and creates a DRAFT GitHub
# release, so nothing becomes public until the owner reviews the draft and clicks "Publish release".
#
# Every artifact is uploaded twice: with the version in its name and under a fixed name
# (e.g. OpenWave-windows-x64-setup.exe). The README download buttons link to
# https://github.com/<owner>/<repo>/releases/latest/download/<fixed name>, so keep those names stable.
# Linux and macOS builds are marked experimental; if one fails the release is still drafted without it.
#
# Actions are pinned by MAJOR version tag; consider pinning to full commit SHAs before the first release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check it matches the tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $toml = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $toml) { Write-Error "Tag v$tag does not match Cargo.toml version $toml"; exit 1 }
          "version=$toml" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build CSS (must match the committed file)
        shell: pwsh
        working-directory: tools
        run: |
          npm ci
          npm run css
          git diff --exit-code -- ../assets/main.css

      - name: Build release executable
        run: cargo build --release --locked

      - name: Stage files
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist, "stage/OpenWave" | Out-Null
          Copy-Item target/release/openwave.exe stage/OpenWave/openwave.exe
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md, CHANGELOG.md stage/OpenWave/
          Copy-Item docs/PRIVACY.md stage/OpenWave/PRIVACY.md
          Compress-Archive -Path stage/OpenWave -DestinationPath "dist/OpenWave-$v-windows-x64-portable.zip" -Force

      - name: Install Inno Setup if the runner image lacks it
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$v" "/DStageDir=$PWD\stage\OpenWave" "/DOutDir=$PWD\dist" installer\openwave.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fixed-name copies for the README download buttons
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item "dist/OpenWave-$v-windows-x64-setup.exe" dist/OpenWave-windows-x64-setup.exe
          Copy-Item "dist/OpenWave-$v-windows-x64-portable.zip" dist/OpenWave-windows-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      - name: System libraries (WebKitGTK, GTK, xdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist stage/OpenWave
          cp target/release/openwave stage/OpenWave/
          cp assets/branding/openwave-icon-512.png stage/OpenWave/openwave.png
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md CHANGELOG.md stage/OpenWave/
          cat > stage/OpenWave/openwave.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenWave
          Comment=A simple, private, local-first desktop music player
          Exec=openwave
          Icon=openwave
          Categories=AudioVideo;Audio;Player;
          EOF
          sed -i 's/^          //' stage/OpenWave/openwave.desktop
          tar -C stage -czf "dist/OpenWave-$v-linux-x86_64.tar.gz" OpenWave
          cp "dist/OpenWave-$v-linux-x86_64.tar.gz" dist/OpenWave-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2

      - name: Build release executable (Apple Silicon)
        run: cargo build --release --locked

      - name: Bundle OpenWave.app
        run: |
          v="${{ steps.ver.outputs.version }}"
          app=stage/OpenWave.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources" dist icon.iconset
          cp target/release/openwave "$app/MacOS/openwave"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/branding/openwave-icon-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d assets/branding/openwave-icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Resources/openwave.icns"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>OpenWave</string>
            <key>CFBundleIdentifier</key><string>io.github.openwave</string>
            <key>CFBundleExecutable</key><string>openwave</string>
            <key>CFBundleIconFile</key><string>openwave</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          ditto -c -k --keepParent stage/OpenWave.app "dist/OpenWave-$v-macos-arm64.zip"
          cp "dist/OpenWave-$v-macos-arm64.zip" dist/OpenWave-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -b $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS

      - name: Create DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*             --repo "${{ github.repository }}"             --draft             --title "OpenWave ${GITHUB_REF_NAME#v}"             --notes "Draft. Edit these notes (see CHANGELOG.md), check the artifacts, then publish. Builds are not code-signed; verify SHA256SUMS. Linux and macOS builds are experimental."
