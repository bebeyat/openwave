# cargo-deny configuration. Run: cargo deny check
# Policy: permissive licenses only (no GPL/AGPL/LGPL). MPL-2.0 is allowed because the only MPL crate
# (option-ext) is used unmodified; see THIRD_PARTY_NOTICES.md.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Informational "unmaintained" notice for a transitive proc-macro of the Dioxus stack; no known vulnerability.
# Revisit when Dioxus drops `paste`.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but has no vulnerability; transitive via Dioxus" },
    # Linux-only stack (GTK 0.18 via wry/tao, D-Bus via rfd); informational, no vulnerability. Revisit on Dioxus upgrades.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; build-time macro of gtk-rs 0.18 (Linux)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained, no vulnerability; transitive D-Bus dependency (Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained, no vulnerability; transitive D-Bus dependency (Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained, no vulnerability; transitive D-Bus dependency (Linux)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/DioxusLabs/components"]
